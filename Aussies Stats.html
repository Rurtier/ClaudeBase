<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Aussies Stats — Lower Third</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
  #root { position: absolute; inset: 0; }
  .alpha-bg {
    position: absolute; inset: 0;
    background-color: #2a2a2a;
    background-image:
      linear-gradient(45deg, #1a1a1a 25%, transparent 25%),
      linear-gradient(-45deg, #1a1a1a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a1a1a 75%),
      linear-gradient(-45deg, transparent 75%, #1a1a1a 75%);
    background-size: 80px 80px;
    background-position: 0 0, 0 40px, 40px -40px, 40px 0px;
  }
</style>
</head>
<body data-screen-label="t=0.0s">
  <div id="root"></div>

  <script src="/vendor/react.development.js"></script>
  <script src="/vendor/react-dom.development.js"></script>
  <script src="/vendor/babel.min.js"></script>

  <script type="text/babel">
// ── Easing ──────────────────────────────────────────────────────────────────
const Easing = {
  linear: (t) => t,
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),
  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),
  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0;
    if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

// ── Timeline ──────────────────────────────────────────────────────────────────
const TimelineContext = React.createContext({ time: 0, duration: 3, playing: false });
const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);

// ── Stats data ───────────────────────────────────────────────────────────────
const STATS = [
  { value: 7000, suffix: '+', label: 'COMPETITORS', format: 'thousands' },
  { value: 550,  suffix: '+', label: 'EVENTS' },
  { value: 316,  suffix: '',  label: 'SURF CLUBS' },
  { value: 6,    suffix: '',  label: 'ARENAS' },
  { value: 9,    suffix: '',  label: 'ACTION PACKED DAYS' },
];

function formatNumber(n, mode) {
  const v = Math.round(n);
  if (mode === 'thousands') return v.toLocaleString('en-US').replace(/,/g, ' ');
  return String(v);
}

// ── StatColumn ───────────────────────────────────────────────────────────────
function StatColumn({ stat, index, total }) {
  const t = useTime();

  const entryStart = 0.1 + index * 0.06;
  const entryEnd   = entryStart + 0.5;
  const countStart = entryStart;
  const countEnd   = countStart + 1.4;
  const exitStart  = 2.7;
  const exitEnd    = 3.0;

  const entryT = t >= entryStart ? clamp((t - entryStart) / (entryEnd - entryStart), 0, 1) : 0;
  const eEntry = Easing.easeOutCubic(entryT);

  const countT = t >= countStart ? clamp((t - countStart) / (countEnd - countStart), 0, 1) : 0;
  const eCount = Easing.easeOutCubic(countT);
  const currentValue = stat.value * eCount;

  const exitT  = t >= exitStart ? clamp((t - exitStart) / (exitEnd - exitStart), 0, 1) : 0;
  const eExit  = Easing.easeInCubic(exitT);

  const opacity = eEntry * (1 - eExit);
  const ty = (1 - eEntry) * 28 + eExit * -8;

  const colWidth = 1920 / total;
  const colX     = index * colWidth;

  return (
    <div style={{
      position: 'absolute', left: colX, top: 0,
      width: colWidth, height: '100%',
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      opacity, transform: `translateY(${ty}px)`,
      willChange: 'transform, opacity',
    }}>
      <div style={{
        width: 56, height: 2,
        background: '#ffffff', marginBottom: 28,
        opacity: 0.7,
        transform: `scaleX(${eEntry})`,
        transformOrigin: 'center',
      }} />
      <div style={{
        fontFamily: '"Helvetica Neue", Helvetica, Arial, sans-serif',
        fontWeight: 300, fontSize: 108, lineHeight: 1,
        color: '#ffffff', letterSpacing: '-0.03em',
        fontVariantNumeric: 'tabular-nums',
        textShadow: '0 2px 18px rgba(0,0,0,0.35)',
        display: 'flex', alignItems: 'baseline',
      }}>
        <span>{formatNumber(currentValue, stat.format)}</span>
        <span style={{
          fontSize: 72, fontWeight: 200, marginLeft: 2,
          opacity: countT > 0.85 ? 1 : 0,
        }}>{stat.suffix}</span>
      </div>
      <div style={{
        marginTop: 22,
        fontFamily: '"Helvetica Neue", Helvetica, Arial, sans-serif',
        fontWeight: 500, fontSize: 18, letterSpacing: '0.22em',
        color: '#ffffff',
        textShadow: '0 1px 8px rgba(0,0,0,0.4)',
        textAlign: 'center', whiteSpace: 'nowrap',
      }}>
        {stat.label}
      </div>
    </div>
  );
}

// ── Dividers ─────────────────────────────────────────────────────────────────
function Dividers({ count }) {
  const t = useTime();
  return (
    <>
      {Array.from({ length: count - 1 }, (_, i) => {
        const idx = i + 1;
        const start = 0.15 + idx * 0.04;
        const end = start + 0.6;
        const p = Easing.easeOutCubic(clamp((t - start) / (end - start), 0, 1));
        const exitT = clamp((t - 2.7) / 0.3, 0, 1);
        const opacity = p * (1 - Easing.easeInCubic(exitT)) * 0.25;
        return (
          <div key={idx} style={{
            position: 'absolute',
            left: (1920 / count) * idx,
            top: '20%', height: `${60 * p}%`,
            width: 1, background: '#ffffff',
            opacity, transform: 'translateX(-0.5px)',
          }} />
        );
      })}
    </>
  );
}

// ── LowerThird ───────────────────────────────────────────────────────────────
function LowerThird() {
  const t = useTime();
  React.useEffect(() => {
    const root = document.querySelector('[data-screen-label]');
    if (root) root.setAttribute('data-screen-label', `t=${(Math.floor(t * 10) / 10).toFixed(1)}s`);
  }, [t]);

  return (
    <div style={{
      position: 'absolute', left: 0, right: 0, bottom: 80, height: 320,
    }}>
      <Dividers count={STATS.length} />
      {STATS.map((s, i) => (
        <StatColumn key={s.label} stat={s} index={i} total={STATS.length} />
      ))}
    </div>
  );
}

// ── PlaybackBar ──────────────────────────────────────────────────────────────
function IconButton({ children, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button onClick={onClick} title={title}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        width: 28, height: 28,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: hover ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)',
        border: '1px solid rgba(255,255,255,0.1)',
        borderRadius: 6, color: '#f6f4ef',
        cursor: 'pointer', padding: 0, transition: 'background 120ms',
      }}>
      {children}
    </button>
  );
}

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);

  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    return clamp((e.clientX - rect.left) / rect.width, 0, 1) * duration;
  }, [duration]);

  const onTrackDown = (e) => { setDragging(true); onSeek(timeFromEvent(e)); onHover(null); };

  React.useEffect(() => {
    if (!dragging) return;
    const onUp   = () => setDragging(false);
    const onMove = (e) => trackRef.current && onSeek(timeFromEvent(e));
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => { window.removeEventListener('mouseup', onUp); window.removeEventListener('mousemove', onMove); };
  }, [dragging, timeFromEvent, onSeek]);

  const pct = duration > 0 ? (time / duration) * 100 : 0;
  const fmt = (t) => {
    const total = Math.max(0, t);
    const m  = Math.floor(total / 60);
    const s  = Math.floor(total % 60);
    const cs = Math.floor((total * 100) % 100);
    return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
  };
  const mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, monospace';

  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '8px 16px',
      background: 'rgba(20,20,20,0.92)',
      borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%', maxWidth: 680, alignSelf: 'center',
      borderRadius: 8, color: '#f6f4ef',
      fontFamily: 'Inter, system-ui, sans-serif',
      userSelect: 'none', flexShrink: 0,
    }}>
      <IconButton onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (space)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconButton>
      <div style={{ fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums', width: 64, textAlign: 'right', color: '#f6f4ef' }}>
        {fmt(time)}
      </div>
      <div ref={trackRef}
        onMouseMove={(e) => { if (!trackRef.current) return; const t = timeFromEvent(e); dragging ? onSeek(t) : onHover(t); }}
        onMouseLeave={() => { if (!dragging) onHover(null); }}
        onMouseDown={onTrackDown}
        style={{ flex: 1, height: 22, position: 'relative', cursor: 'pointer', display: 'flex', alignItems: 'center' }}>
        <div style={{ position: 'absolute', left: 0, right: 0, height: 4, background: 'rgba(255,255,255,0.12)', borderRadius: 2 }}/>
        <div style={{ position: 'absolute', left: 0, width: `${pct}%`, height: 4, background: 'oklch(72% 0.12 250)', borderRadius: 2 }}/>
        <div style={{ position: 'absolute', left: `${pct}%`, top: '50%', width: 12, height: 12, marginLeft: -6, marginTop: -6, background: '#fff', borderRadius: 6, boxShadow: '0 2px 4px rgba(0,0,0,0.4)' }}/>
      </div>
      <div style={{ fontFamily: mono, fontSize: 12, fontVariantNumeric: 'tabular-nums', width: 64, textAlign: 'left', color: 'rgba(246,244,239,0.55)' }}>
        {fmt(duration)}
      </div>
    </div>
  );
}

// ── Stage ─────────────────────────────────────────────────────────────────────
function Stage({ width = 1280, height = 720, duration = 10, background = '#f6f4ef', fps = 60, loop = true, autoplay = true, persistKey = 'animstage', children }) {
  const [time, setTime] = React.useState(() => {
    try {
      const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
      return isFinite(v) ? clamp(v, 0, duration) : 0;
    } catch { return 0; }
  });
  const [playing, setPlaying] = React.useState(autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);
  const stageRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  React.useEffect(() => {
    try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
  }, [time, persistKey]);

  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 44;
      const s = Math.min(el.clientWidth / width, (el.clientHeight - barH) / height);
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
  }, [width, height]);

  React.useEffect(() => {
    if (!playing) { lastTsRef.current = null; return; }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) { if (loop) next = next % duration; else { next = duration; setPlaying(false); } }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); lastTsRef.current = null; };
  }, [playing, duration, loop]);

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
      else if (e.code === 'ArrowLeft')  setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
      else if (e.code === 'ArrowRight') setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
      else if (e.key === '0' || e.code === 'Home') setTime(0);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const displayTime = hoverTime != null ? hoverTime : time;
  const ctxValue = React.useMemo(() => ({ time: displayTime, duration, playing, setTime, setPlaying }), [displayTime, duration, playing]);

  return (
    <div ref={stageRef} style={{
      position: 'absolute', inset: 0,
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      background: '#0a0a0a',
      fontFamily: 'Inter, system-ui, sans-serif',
    }}>
      <div style={{ flex: 1, width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden', minHeight: 0 }}>
        <div style={{
          width, height, background,
          position: 'relative',
          transform: `scale(${scale})`, transformOrigin: 'center',
          flexShrink: 0,
          boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
          overflow: 'hidden',
        }}>
          <TimelineContext.Provider value={ctxValue}>
            {children}
          </TimelineContext.Provider>
        </div>
      </div>
      <PlaybackBar
        time={displayTime} actualTime={time} duration={duration} playing={playing}
        onPlayPause={() => setPlaying(p => !p)}
        onReset={() => setTime(0)}
        onSeek={(t) => setTime(t)}
        onHover={(t) => setHoverTime(t)}
      />
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  return (
    <Stage width={1920} height={1080} duration={3} fps={50} loop={true} background="transparent" persistKey="aussies-stats">
      <div className="alpha-bg" />
      <LowerThird />
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
