<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#0c0e12"/>
  <!-- Yamanote-style loop -->
  <ellipse cx="256" cy="256" rx="150" ry="180" fill="none" stroke="#9ACD32" stroke-width="20"/>
  <!-- a couple of crossing lines -->
  <line x1="120" y1="200" x2="392" y2="200" stroke="#F15A22" stroke-width="14" stroke-linecap="round"/>
  <line x1="160" y1="330" x2="360" y2="330" stroke="#00B2E3" stroke-width="14" stroke-linecap="round"/>
  <!-- glowing station LEDs -->
  <circle cx="256" cy="76" r="16" fill="#9ACD32"/>
  <circle cx="406" cy="256" r="16" fill="#FFD500"/>
  <circle cx="256" cy="436" r="16" fill="#E60012"/>
  <circle cx="106" cy="256" r="16" fill="#FF9500"/>
</svg>
